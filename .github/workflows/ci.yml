name: CI

on:
  push:
    branches: [main, 'completion/**', 'feature/testnet-settings-admin']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck && npm run typecheck:terminal && npm run typecheck:config

      - name: Build library
        run: npm run build

      - name: Build trading terminal
        run: npm run build:example

      - name: Run tests
        run: npm test

  backend-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]" pip-audit

      - name: Compile Python
        run: python -m compileall -q app

      - name: Run backend tests
        run: pytest -q

      - name: Audit Python dependencies
        run: pip-audit
