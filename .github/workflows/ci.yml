name: CI

on:
  push:
    branches: [main, 'completion/**', 'feature/testnet-settings-admin']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Prepare disposable, non-production preflight fixtures
        run: |
          mkdir -p /tmp/m1-staging-secrets
          head -c 32 /dev/urandom | base64 > /tmp/m1-staging-secrets/key
          chmod 600 /tmp/m1-staging-secrets/key
          {
            printf 'M1_AUTH_SECRET=%s\n' "$(openssl rand -base64 48)"
            printf 'M1_SITE_ADDRESS=staging.example.invalid\n'
            printf 'M1_ADMIN_USERNAME=ci-staging-admin\n'
            printf 'M1_ADMIN_PASSWORD_HASH=ci-only-placeholder-not-used-for-login\n'
            printf 'M1_TESTNET_ENCRYPTION_KEY_FILE=/tmp/m1-staging-secrets/key\n'
          } > .env
          chmod 600 .env
          echo "M1_TESTNET_ENCRYPTION_KEY_FILE=/tmp/m1-staging-secrets/key" >> "$GITHUB_ENV"
      - name: Run staging preflight checks (no deployment)
        run: bash scripts/staging_preflight.sh

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck && npm run typecheck:terminal && npm run typecheck:config

      - name: Build library
        run: npm run build

      - name: Build trading terminal
        run: npm run build:example

      - name: Run tests
        run: npm test

  backend-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]" pip-audit

      - name: Compile Python
        run: python -m compileall -q app

      - name: Run backend tests
        run: pytest -q

      - name: Audit Python dependencies
        run: pip-audit
