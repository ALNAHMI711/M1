name: browser-check

on:
  push:
    branches: [main, 'completion/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal:
    runs-on: ubuntu-latest
    env:
      M1_DB_PATH: /tmp/m1-browser-ci.sqlite3
      M1_AUTH_SECRET: ci-only-secret-never-use-in-deployment-0123456789
      M1_ADMIN_USERNAME: ci-admin
      M1_E2E_USERNAME: ci-admin
      M1_E2E_PASSWORD: ci-password-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Install backend
        run: |
          python -m pip install -r backend/requirements.lock
          python -m pip install -e backend --no-deps
      - name: Start isolated backend
        working-directory: backend
        run: |
          export M1_ADMIN_PASSWORD_HASH="$(python -c 'import os; from pwdlib import PasswordHash; print(PasswordHash.recommended().hash(os.environ["M1_E2E_PASSWORD"]))')"
          uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-proxy-headers --no-access-log >/tmp/m1-ci-backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ready; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm run test:e2e
