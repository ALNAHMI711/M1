name: Deploy to GitHub Pages (manual only)

# Intentionally no push trigger: merging code must not deploy a site automatically.
# Run this workflow manually only after explicitly enabling/configuring GitHub Pages.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build library
        run: npm run build

      - name: Build example site
        run: npm run build:example

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-example

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
