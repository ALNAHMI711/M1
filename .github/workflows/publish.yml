name: Publish package (manual only)

# Tagging a GitHub Release must not publish to npm implicitly.
# Run manually only after explicitly deciding to publish the package.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Use the latest oakscriptjs release
        run: |
          npm install --no-save oakscriptjs@latest
          version=$(node -p "require('oakscriptjs/package.json').version")
          range=$(node -p "require('./package.json').peerDependencies.oakscriptjs")
          npx --yes semver@7 -r "$range" "$version" || { echo "oakscriptjs $version is outside the peer range $range"; exit 1; }

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
