services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    secrets:
      - source: m1_testnet_encryption_key
        target: m1_testnet_encryption_key
    environment:
      M1_DB_PATH: /data/m1.sqlite3
      M1_TESTNET_ENCRYPTION_KEY_FILE: /run/secrets/m1_testnet_encryption_key
      M1_ALLOWED_HOSTS: localhost,127.0.0.1,backend
    volumes:
      - m1-data:/data
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  web:
    build:
      context: .
      dockerfile: deploy/Frontend.Dockerfile
    restart: unless-stopped
    environment:
      M1_SITE_ADDRESS: ${M1_SITE_ADDRESS:?Set M1_SITE_ADDRESS to a public DNS hostname}
    ports:
      - "${M1_HTTP_PORT:-80}:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy

secrets:
  m1_testnet_encryption_key:
    file: ${M1_TESTNET_ENCRYPTION_KEY_FILE:?Set M1_TESTNET_ENCRYPTION_KEY_FILE to an absolute protected file path outside the repository}

volumes:
  m1-data:
  caddy-data:
  caddy-config:
